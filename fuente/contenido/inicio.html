<style>
  /* =========================================================
     PORTADA RCP · fondo fotográfico + personaje flotante + curva
     Composición estándar Waygroup (la de TSA). Las tres capas las
     entrega diseño en Banner_HTML/: Fondo, Curva y Person.
     (el CSS de portada viaja por curso — decisión E5)
     ========================================================= */
  .rcp-portada{
    position:relative; overflow:hidden; isolation:isolate;
    min-height:100vh; min-height:100dvh;
    background:
      linear-gradient(100deg, color-mix(in srgb, var(--c-deep) 92%, black) 0%,
                              color-mix(in srgb, var(--c-deep) 55%, transparent) 55%,
                              color-mix(in srgb, var(--c-deep) 30%, transparent) 100%),
      url('assets/img/curso/portada-fondo.png') center/cover no-repeat;
    display:flex; align-items:center;
  }
  .rcp-portada__curva{
    position:absolute; right:-40px; bottom:-30px; width:min(48vw, 640px); z-index:1;
    pointer-events:none; user-select:none;
  }
  .rcp-portada__person{
    position:absolute; right:clamp(16px, 6vw, 110px); bottom:0; width:min(52vw, 760px); z-index:2;
    pointer-events:none; user-select:none;
    filter: drop-shadow(0 30px 60px rgba(0,0,0,.45));
  }
  .rcp-portada__logo{
    position:absolute; top:28px; right:36px; z-index:4;
  }
  .rcp-portada__logo img{
    height:84px; width:auto; display:block;
    filter: brightness(0) invert(1);
  }
  .rcp-portada__text{
    position:relative; z-index:3; max-width:640px;
    padding: clamp(32px, 6vw, 96px);
  }
  .rcp-portada__title{
    margin:0 0 26px; font-family:var(--font-display); line-height:1.04; letter-spacing:-.02em;
  }
  .rcp-portada__title span{ display:block; }
  .rcp-portada__title .suave { color:var(--c-acento); font-weight:400; font-size:clamp(2.4rem,5vw,4rem); opacity:.95; }
  .rcp-portada__title .fuerte{ color:#fff;            font-weight:800; font-size:clamp(2.6rem,5.6vw,4.4rem); }
  .rcp-portada__title .sigla { color:var(--c-acento); font-weight:800; font-size:clamp(2.4rem,5vw,4rem); }
  .rcp-portada__intro{
    color:color-mix(in srgb, #fff 82%, transparent); font-size:1.06rem; line-height:1.65;
    max-width:520px; margin:0 0 36px;
  }
  .rcp-portada__cta{
    display:inline-flex; align-items:center; gap:10px;
    background:var(--c-acento); color:#fff; text-decoration:none;
    font-family:var(--font-display); font-weight:700; font-size:1rem;
    padding:16px 30px; border-radius:999px;
    box-shadow:0 14px 34px color-mix(in srgb, var(--c-acento) 45%, transparent);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .rcp-portada__cta:hover{ transform:translateY(-2px); box-shadow:0 20px 44px color-mix(in srgb, var(--c-acento) 55%, transparent); }
  @media (max-width: 900px){
    .rcp-portada__person{ opacity:.34; right:-14vw; width:80vw; }
    .rcp-portada__logo img{ height:60px; }
  }
</style>

<section class="rcp-portada">
  <img class="rcp-portada__curva"  src="assets/img/curso/portada-curva.png" alt="" aria-hidden="true" />
  <img class="rcp-portada__person" src="assets/img/curso/portada-person.png" alt="" aria-hidden="true" />
  <div class="rcp-portada__logo" aria-hidden="true">
    <img src="assets/img/logos/waygroup-for-education.svg" alt="WAYGROUP for education" />
  </div>
  <div class="rcp-portada__text">
    <h1 class="rcp-portada__title">
      <span class="suave">Reanimación</span>
      <span class="fuerte">Cardiopulmonar Básico</span>
      <span class="sigla">(RCP)</span>
    </h1>
    <p class="rcp-portada__intro">
      En este curso aprenderás cómo actuar ante una persona que presenta una posible parada cardíaca.
    </p>
    <a class="rcp-portada__cta" href="presentacion.html">
      Comenzar el curso <iconify-icon icon="mdi:arrow-right"></iconify-icon>
    </a>
  </div>
</section>
